name: Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check version compatibility
        env:
          REQUIRE_SUPPORTED: "true"
        run: ./scripts/check-compatibility.sh x86_64-linux

      - name: Build SpotX Spotify
        run: nix build .#packages.x86_64-linux.spotify-spotx --no-link --print-build-logs

  build-darwin:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check version compatibility
        env:
          REQUIRE_SUPPORTED: "true"
        run: ./scripts/check-compatibility.sh aarch64-darwin

      - name: Build SpotX Spotify
        run: nix build .#packages.aarch64-darwin.spotify-spotx --print-build-logs

      - name: Verify Darwin application
        run: ./scripts/check-darwin-app.sh

      - name: Archive Darwin application
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            result/Applications/Spotify.app \
            spotify-spotx-aarch64-darwin.zip
          shasum -a 256 spotify-spotx-aarch64-darwin.zip \
            > spotify-spotx-aarch64-darwin.zip.sha256

      - name: Upload Darwin application
        uses: actions/upload-artifact@v4
        with:
          name: spotify-spotx-aarch64-darwin
          path: |
            spotify-spotx-aarch64-darwin.zip
            spotify-spotx-aarch64-darwin.zip.sha256
          retention-days: 7
